[package]
name = "ocv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ocv-core = { path = "../core" }
ocv-auto = { path = "../auto" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ocv-auto-edit"
path = "src/main.rs"

[lib]
name = "ocv_cli"
path = "src/lib.rs"
