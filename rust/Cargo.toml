[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/gpu",
    "crates/auto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
image = "0.25"
imageproc = "0.25"
fast_image_resize = "5.0"
ab_glyph = "0.2"
wgpu = "23.0"
bytemuck = "1.18"
pollster = "0.4"
mp4ameta = "0.12"
tempfile = "3.10"
animato = { version = "1.7", features = ["tween", "spring", "timeline", "path", "color", "physics", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
